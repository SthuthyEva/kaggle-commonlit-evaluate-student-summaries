exp_name: '5'
seed: 42
# log_path: ./log/p
# config_path: ./config/
# weight_path: /home/phalanx/weights/imet/
header: fold fn epoch batch loss score

root: /home/sthueva/Documents/kaggle/
competition: commonlit-evaluate-student-summaries
input_path: input
output_path: output
weights_path: weights
input_filename: train_fold{}_seed42_{}.csv
cv: c1
preprocess: p1

train_loader:
  batch_size: 12
  shuffle: True
  num_workers: 6
  pin_memory: True
  drop_last: False

val_loader:
  batch_size: 12
  shuffle: False
  num_workers: 6
  pin_memory: True
  drop_last: False

# model: 'microsoft/deberta-v3-large'
# model: 'microsoft/deberta-large'
# model: 'microsoft/deberta-xlarge'
# model: 'microsoft/deberta-v3-xsmall'
model: 'microsoft/deberta-v3-small'
# model: 'microsoft/deberta-v3-base'
# model: 'microsoft/deberta-base'
# model: 'roberta-large'

model_config:
  output_hidden_states: True
  attention_probs_dropout_prob: 0
  attention_dropout: 0
  hidden_dropout_prob: 0
  hidden_dropout: 0
  layer_norm_eps: 1e-7
  add_pooling_layer: False

optimizer:
  name: AdamW
  head_lr: 1e-3
  lr: 1e-4
  weight_decay: 0.1
  eps: 1e-6
  betas: [0.9, 0.999]
  lr_decay_rate: 0.99
  lr_decay_type: C
   
scheduler: 
  name: cosine
  num_warmup_steps: 0
  
train:
  model: m21
  fp16: True
  debug: False
  n_folds: 4
  after_eval_epoch : -1
  eval_steps: 100
  max_grad_norm: 1000
  head: False
  body_epochs: 4
  scheduler_epochs: 3
  gradient_accumulate: 1
  max_length: 512
  num_freeze: 0
  loss: rmse
  freeze_layers: ['embeddings', 'encoder', 'decoder']
  label_cols: ["content", "wording"]
  num_labels: 2